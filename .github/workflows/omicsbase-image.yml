# OmicsBase: build the LibreChat image of this fork on every merge into the OmicsBase branch and
# push it to ghcr.io, tagged with the commit. Deploying is then `docker pull` plus a restart on the
# server, instead of a build there. Release images for local installs keep their own names.
name: OmicsBase image

on:
  push:
    branches:
      - chore/librechat-upstream-20261021
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: omicsbase-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # The image and its build stages need more room than the runner has free by default.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tag
        id: tag
        run: echo "short=${GITHUB_SHA::9}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/0xmuluh/omicsbase-librechat-build:${{ steps.tag.outputs.short }}
            ghcr.io/0xmuluh/omicsbase-librechat-build:edge
          labels: |
            org.opencontainers.image.source=https://github.com/0xMuluh/LibreChat
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=OmicsBase LibreChat, built from the fork
          cache-from: type=gha
          cache-to: type=gha,mode=max
